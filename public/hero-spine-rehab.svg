<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="25" y="25" width="550" height="400" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Animated Decorative Rings -->
  <circle cx="480" cy="110" r="75" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="8 6" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 480 110" to="360 480 110" dur="25s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="340" r="60" fill="none" stroke="#0d9488" stroke-width="2" opacity="0.4"/>

  <!-- Medical Spine & Biomechanics Graphic -->
  <g transform="translate(180, 80)">
    <!-- Spine Central Axis -->
    <path d="M120,20 Q115,80 125,140 T120,260" stroke="url(#tealGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Vertebrae Nodes -->
    <g fill="url(#tealGrad)">
      <circle cx="120" cy="35" r="14" />
      <circle cx="117" cy="80" r="15" />
      <circle cx="121" cy="125" r="16" />
      <circle cx="125" cy="170" r="16" />
      <circle cx="122" cy="215" r="15" />
      <circle cx="120" cy="255" r="14" />
    </g>
    <!-- Intervertebral Discs (Gold Highlights) -->
    <g fill="url(#goldGrad)">
      <rect x="110" y="52" width="20" height="8" rx="4" />
      <rect x="108" y="98" width="22" height="9" rx="4.5" />
      <rect x="111" y="144" width="22" height="9" rx="4.5" />
      <rect x="113" y="189" width="20" height="8" rx="4" />
      <rect x="111" y="233" width="18" height="8" rx="4" />
    </g>
    <!-- Alignment Biomechanical Waves -->
    <path d="M50,80 C80,60 160,60 190,80" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="6 4" fill="none" opacity="0.7"/>
    <path d="M45,170 C80,150 165,150 195,170" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 4" fill="none" opacity="0.8"/>
  </g>

  <!-- Medical Stethoscope Element -->
  <path d="M380,130 C410,130 430,160 430,200 C430,250 380,280 340,280 C300,280 270,310 270,340" stroke="#0f766e" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="270" cy="345" r="16" fill="url(#goldGrad)" />
  <circle cx="270" cy="345" r="8" fill="white" />

  <!-- Jaipur Authority Badge Graphic inside SVG -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="190" height="52" rx="14" fill="white" filter="url(#shadow)"/>
    <circle cx="26" cy="26" r="12" fill="#dcfce7"/>
    <path d="M21 26l3 3 6-6" stroke="#047857" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="23" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#0f172a">ADVANCED REHAB</text>
    <text x="48" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#0d9488">C Scheme • Jaipur</text>
  </g>

  <g transform="translate(340, 310)">
    <rect x="0" y="0" width="200" height="56" rx="14" fill="white" filter="url(#shadow)"/>
    <circle cx="28" cy="28" r="14" fill="#fef3c7"/>
    <text x="28" y="33" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#d97706">★</text>
    <text x="54" y="24" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#0f172a">5.0 GOOGLE RATED</text>
    <text x="54" y="41" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748b">Opposite SMS Hospital</text>
  </g>
</svg>
