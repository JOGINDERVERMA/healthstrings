<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="600" height="650" rx="36" fill="url(#bgGrad)" />

  <!-- Background Decorative Medical Grid -->
  <g opacity="0.08" stroke="#2dd4bf" stroke-width="1.5">
    <circle cx="500" cy="100" r="140" fill="none" />
    <circle cx="500" cy="100" r="90" fill="none" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="360" x2="600" y2="360" />
    <line x1="300" y1="0" x2="300" y2="650" />
  </g>

  <!-- Specialist Medical Shield Frame -->
  <g filter="url(#shadow)" transform="translate(140, 60)">
    <circle cx="160" cy="150" r="125" fill="#1e293b" stroke="url(#tealGrad)" stroke-width="5" />
    <!-- Stylized Doctor Silhouette/Cross Icon -->
    <circle cx="160" cy="120" r="42" fill="#e2e8f0" />
    <path d="M95 235 C100 175 220 175 225 235 Z" fill="#2dd4bf" />
    <path d="M140 180 L180 180 L180 235 L140 235 Z" fill="#ffffff" />
    <!-- Stethoscope Graphic -->
    <path d="M135 155 Q135 210 160 210 Q185 210 185 155" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Verified Trust Badge -->
  <g transform="translate(380, 80)">
    <rect width="170" height="42" rx="21" fill="url(#tealGrad)" />
    <text x="85" y="26" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">VERIFIED SPECIALIST</text>
  </g>

  <!-- Dr. Meenakshi Kanwar Sisodia Info Card -->
  <g transform="translate(50, 360)">
    <rect width="500" height="240" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <text x="35" y="48" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" fill="#ffffff">Dr. Meenakshi Kanwar Sisodia</text>
    <text x="35" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#2dd4bf">LEAD CLINICAL NUTRITIONIST &amp; RECOVERY SPECIALIST</text>

    <!-- Credentials Line -->
    <text x="35" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" fill="#cbd5e1">
      • 12+ Years Clinical Excellence in Jaipur Healthcare Hub
    </text>
    <text x="35" y="146" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" fill="#cbd5e1">
      • Root-Cause Specialist: Non-Surgical Pain &amp; Metabolic Care
    </text>
    <text x="35" y="174" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" fill="#cbd5e1">
      • Opposite SMS Hospital Medical Precinct • C-Scheme Jaipur
    </text>

    <!-- Gold Rating Pill -->
    <g transform="translate(35, 195)">
      <rect width="190" height="30" rx="8" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1" />
      <text x="95" y="20" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#f59e0b" text-anchor="middle">★ 5.0 VERIFIED RATING (1,400+ PATIENTS)</text>
    </g>
  </g>
</svg>
