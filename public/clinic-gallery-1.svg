<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="suiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="28" fill="url(#suiteGrad)" />

  <!-- Grid Pattern -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- High-Tech Decompression Table & Rehab Bay Illustration -->
  <g transform="translate(100, 100)">
    <rect x="50" y="140" width="380" height="40" rx="12" fill="#334155" stroke="#2dd4bf" stroke-width="3" />
    <rect x="90" y="180" width="30" height="90" fill="#64748b" />
    <rect x="360" y="180" width="30" height="90" fill="#64748b" />
    <!-- Pulse Line Graphic -->
    <path d="M70 120 L150 120 L175 80 L200 160 L225 100 L250 120 L350 120" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" />
    <!-- Monitor Screen -->
    <rect x="460" y="60" width="140" height="100" rx="12" fill="#090d16" stroke="#2dd4bf" stroke-width="2" />
    <text x="530" y="115" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#2dd4bf" text-anchor="middle">99.8% BIO-SYNC</text>
  </g>

  <!-- Caption Overlay Card -->
  <g transform="translate(40, 340)">
    <rect width="720" height="74" rx="16" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <text x="30" y="32" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#ffffff">INSIDE HEALTHSTRINGS CLINIC • ADVANCED REHABILITATION SUITE</text>
    <text x="30" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#2dd4bf">Opposite SMS Hospital, C-Scheme Jaipur • Dedicated Non-Surgical Spinal &amp; Orthopedic Care</text>
  </g>
</svg>
