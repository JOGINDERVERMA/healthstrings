<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="nutritionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="28" fill="url(#nutritionGrad)" />

  <!-- Decorative Rings -->
  <g opacity="0.15" stroke="#2dd4bf" stroke-width="2">
    <circle cx="200" cy="200" r="120" fill="none" />
    <circle cx="200" cy="200" r="80" fill="none" />
    <circle cx="600" cy="200" r="140" fill="none" />
  </g>

  <!-- Nutrition & Diagnostics Visual Elements -->
  <g transform="translate(140, 80)">
    <!-- Consultation Desk & Assessment Chart -->
    <rect x="0" y="40" width="520" height="180" rx="20" fill="rgba(255,255,255,0.06)" stroke="#2dd4bf" stroke-width="2" />
    <!-- DNA/Metabolic Helix Symbol -->
    <path d="M60 80 Q90 130 60 180 M100 80 Q70 130 100 180" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" />
    <text x="140" y="105" font-family="'Outfit', sans-serif" font-size="24" font-weight="800" fill="#ffffff">Metabolic &amp; Hormonal Profiling Suite</text>
    <text x="140" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#cbd5e1">Personalized Dietetics • Gut Health • PCOS • Thyroid Diagnostics</text>
    <text x="140" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#2dd4bf">✨ Root-Cause Healing Without Crash Diets</text>
  </g>

  <!-- Caption Card -->
  <g transform="translate(40, 340)">
    <rect width="720" height="74" rx="16" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <text x="30" y="32" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#ffffff">INSIDE HEALTHSTRINGS CLINIC • CLINICAL NUTRITION SUITE</text>
    <text x="30" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#2dd4bf">Opposite SMS Hospital, C-Scheme Jaipur • Evidence-Based Lifestyle &amp; Dietary Care</text>
  </g>
</svg>
